name: RetroHiscore

x-api-environment: &api-environment
  ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=postgres;Port=5432;Database=retrohiscore;Username=retrohiscore;Password=retrohiscore}
  ASPNETCORE_URLS: http://+:8080
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  RA__Username: ${RA__Username:-}
  RA__ApiKey: ${RA__ApiKey:-}
  Sync__IntervalMinutes: ${Sync__IntervalMinutes:-15}
  Sync__ManualCooldownSeconds: ${Sync__ManualCooldownSeconds:-60}
  GameMetadataSync__ManualCooldownSeconds: ${GameMetadataSync__ManualCooldownSeconds:-300}
  ConsoleIconSync__ManualCooldownSeconds: ${ConsoleIconSync__ManualCooldownSeconds:-300}
  ConsoleIconSync__ForceRefresh: ${ConsoleIconSync__ForceRefresh:-false}
  RA__MediaBaseUrl: ${RA__MediaBaseUrl:-https://media.retroachievements.org}
  Hangfire__DashboardSecret: ${Hangfire__DashboardSecret:-}
  Scalar__DashboardSecret: ${Scalar__DashboardSecret:-}
  Notifications__DiscordWebhookUrl: ${Notifications__DiscordWebhookUrl:-}
  Notifications__NotifyOnRankChange: ${Notifications__NotifyOnRankChange:-true}
  Notifications__NotifyOnNewLead: ${Notifications__NotifyOnNewLead:-true}
  AUTH_SECRET: ${AUTH_SECRET:-}
  AUTH_URL: ${AUTH_URL:-http://localhost:18321}
  AUTH_ADMIN_DISCORD_USER_IDS: ${AUTH_ADMIN_DISCORD_USER_IDS:-}
  COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-true}
  COLLECTOR_FREQUENCY: ${COLLECTOR_FREQUENCY:-60}
  Telemetry__Enabled: ${COLLECTOR_ENABLED:-true}
  Telemetry__OtlpEndpoint: ${Telemetry__OtlpEndpoint:-http://otel-collector:4317}
  Telemetry__GaugeIntervalSeconds: ${COLLECTOR_FREQUENCY:-60}
  Telemetry__ExportIntervalSeconds: ${COLLECTOR_FREQUENCY:-60}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  OTEL_SERVICE_NAME: retro-hiscore-api

x-web-environment: &web-environment
  API_URL: ${API_URL:-http://api:8080}
  AUTH_SECRET: ${AUTH_SECRET:-}
  AUTH_URL: ${AUTH_URL:-http://localhost:18321}
  AUTH_DISCORD_ID: ${AUTH_DISCORD_ID:-}
  AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET:-}
  AUTH_ADMIN_DISCORD_USER_IDS: ${AUTH_ADMIN_DISCORD_USER_IDS:-}
  NEXTAUTH_URL: ${AUTH_URL:-http://localhost:18321}
  NEXTAUTH_SECRET: ${AUTH_SECRET:-}
  COLLECTOR_ENABLED: ${COLLECTOR_ENABLED:-true}
  COLLECTOR_FREQUENCY: ${COLLECTOR_FREQUENCY:-60}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  OTEL_SERVICE_NAME: retro-hiscore-web
  OTEL_METRIC_EXPORT_INTERVAL: ${COLLECTOR_FREQUENCY:-60}

services:
  postgres:
    container_name: RetroHiscore-postgres
    image: postgres:16-alpine
    # Must match Database/Username/Password in ConnectionStrings__Default
    environment:
      POSTGRES_USER: retrohiscore
      POSTGRES_PASSWORD: retrohiscore
      POSTGRES_DB: retrohiscore
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrohiscore -d retrohiscore"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    container_name: RetroHiscore-otel-collector
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      DEPLOYMENT_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${COLLECTOR_PORT:-8889}:8889"
      - "${COLLECTOR_OTLP_GRPC_HOST_PORT:-14317}:4317"
      - "${COLLECTOR_OTLP_HTTP_HOST_PORT:-14318}:4318"

  api:
    profiles: [dev]
    container_name: RetroHiscore-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "18943:8080"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_BROWSER_REFRESH: "1"
    volumes:
      - ./apps/api:/src/apps/api
      - api_bin:/src/apps/api/bin
      - api_obj:/src/apps/api/obj
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  api-prod:
    profiles: [prod]
    container_name: RetroHiscore-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "18943:8080"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      default:
        aliases:
          - api

  web:
    profiles: [dev]
    container_name: RetroHiscore-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    ports:
      - "18321:3000"
    environment:
      <<: *web-environment
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - api
      - otel-collector

  web-prod:
    profiles: [prod]
    container_name: RetroHiscore-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "18321:3000"
    environment:
      <<: *web-environment
      API_URL: ${API_URL:-http://api-prod:8080}
    depends_on:
      - api-prod
      - otel-collector
    networks:
      default:
        aliases:
          - web

  caddy:
    container_name: RetroHiscore-caddy
    image: caddy:2-alpine
    profiles:
      - proxy
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web
      - api-prod
      - web-prod

volumes:
  postgres_data:
    name: RetroHiscore_postgres_data
  api_bin:
  api_obj:
  web_node_modules:
  web_next:
